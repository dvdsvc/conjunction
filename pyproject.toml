[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lbd-scientific-relation-learning"
version = "0.1.0"
description = "Research snapshot of temporal scientific graph representations, feature fusion, ranking training and retrieval evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2"]
[project.optional-dependencies]
train = ["torch>=2.5,<3"]
encoders = ["transformers>=4.40,<5", "sentence-transformers>=3,<6", "requests>=2,<3"]
legacy = ["pandas>=2,<4", "orjson>=3,<4", "tqdm>=4,<5", "networkx>=3,<4", "numba>=0.61,<1"]
[tool.setuptools.packages.find]
include = ["research*"]
exclude = ["tests*", "examples*", "docs*", "scripts*"]
