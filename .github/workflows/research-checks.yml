name: Research pipeline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-research:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          version: "0.11.16"
      - run: uv sync --locked --extra train
      - run: uv run --locked --extra train python -m tests.test_research_contracts
      - run: uv run --locked --extra train python -m examples.synthetic_pipeline
      - run: uv run --locked --extra train python -m scripts.check_repository
